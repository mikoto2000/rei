name: Java regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Preserve repository LF fixtures
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Use canonical temporary paths
        shell: pwsh
        run: |
          $testTemp = Join-Path $env:RUNNER_TEMP 'rei-junit'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
      - name: Full regression with process deadline
        run: .\.github\ci\full-test.ps1
