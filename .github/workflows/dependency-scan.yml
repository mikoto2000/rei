name: Dependency vulnerability scan
on:
  schedule:
    - cron: '24 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=pom.xml
        --lockfile=client/package-lock.json
        --lockfile=client/src-tauri/Cargo.lock
  terminal:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      matrix-property: terminal-
      upload-sarif: false
      # OSV cannot resolve unpublished dependencies between reactor modules.
      scan-args: |-
        --no-resolve
        --recursive
        ./terminal
