name: Dependency vulnerability scan
on:
  schedule:
    - cron: '24 2 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --recursive
        ./
