[package]
name = "rei-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "rei_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rei-client"
path = "src/main.rs"
required-features = ["native"]

[features]
default = []
native = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "stream"] }
webpki-root-certs = "1.0"
url = "2"
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chacha20poly1305 = "0.11"
argon2 = "0.6"
rand = "0.10"
tempfile = "3"
sha2 = "0.11"
base64 = "0.23"

tauri = { version = "2", features = [] }
tauri-plugin-notification = { version = "2" }
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
axum = "0.8"
tauri = { version = "2", features = ["test"] }
tokio-rustls = "0.26"

[patch.crates-io]
# GTK3 still requires glib 0.18. This crate carries the upstream VariantStrIter fix.
glib = { path = "vendor/glib-0.18.5" }

# Windows can deny the final rename of an incremental session. Build complete
# artifacts instead of retaining a cache that the compiler cannot finalize.
[profile.dev]
incremental = false

[profile.test]
incremental = false
